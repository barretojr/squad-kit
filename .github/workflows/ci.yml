name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile squad-kit/mcp/server.py install_claude.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  shell:
    name: Installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n install.sh
      - name: Install into a temp project
        run: |
          tmp="$(mktemp -d)"
          ./install.sh "$tmp"
          test -f "$tmp/.agents/skills/squad/SKILL.md"
          test -f "$tmp/.agents/skills/squad/references/rules.md"
          grep -q '^\.squad/' "$tmp/.gitignore"
